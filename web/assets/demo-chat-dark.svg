<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Chat: prefix plus question to answer, with per-turn cost line">
  <rect width="900" height="260" fill="#0b1120"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-rendering="geometricPrecision">
    <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">memoir chat — whole-context recall</text>
    <rect x="36" y="52" width="828" height="30" rx="6" fill="#1e1b4b" stroke="#6b8af5" stroke-width="1.2"/>
    <text x="50" y="72" font-size="12" fill="#e0e7ff">prefix: 346 tokens, your full personal history, re-sent every turn</text>
    <rect x="36" y="100" width="500" height="30" rx="6" fill="#111827" stroke="#475569" stroke-width="1"/>
    <text x="50" y="120" font-size="12" fill="#e2e8f0">you&gt; Which books changed how I work, and what pace to break 2:00?</text>
    <rect x="36" y="142" width="828" height="48" rx="6" fill="#052e1f" stroke="#34d399" stroke-width="1.2"/>
    <text x="50" y="162" font-size="12" fill="#a7f3d0">memoir&gt; The Mom Test changed how you interview users.</text>
    <text x="50" y="180" font-size="12" fill="#a7f3d0">You need 5:40/km for 21k to break 2:00; you're at 5:45/km now.</text>
    <text x="450" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">DeepSeek prefix-cache: $0.0004/turn</text>
    <text x="450" y="238" text-anchor="middle" font-size="12" fill="#94a3b8">OpenAI equivalent: $0.0039/turn</text>
  </g>
</svg>
