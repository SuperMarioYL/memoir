[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "memoir"
version = "0.1.0"
description = "Consumer AI that remembers your whole life — affordable on DeepSeek prefix-cache."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "SuperMarioYL" }]
keywords = ["deepseek", "prefix-cache", "memory", "llm", "cli", "long-context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "xxhash>=3.0",
]

[project.scripts]
memoir = "memoir.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/memoir"
Issues = "https://github.com/SuperMarioYL/memoir/issues"

[tool.hatch.build.targets.wheel]
packages = ["memoir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"
